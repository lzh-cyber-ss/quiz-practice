<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex, nofollow">
  <title>404</title>
  <style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#fff;color:#222;font:700 56px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}</style>
</head>
<body>
  <main>404</main>
  <script>
    (async () => {
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        localStorage.clear();
        sessionStorage.clear();
        if ('serviceWorker' in navigator) {
          const registration = await navigator.serviceWorker.register('./sw.js?v=retired404-2', { updateViaCache: 'none' });
          await registration.update();
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
