<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="robots" content="noindex, nofollow">
  <title>页面已停止使用</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f8;color:#1f292e;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}.card{width:min(520px,100%);padding:38px 28px;border:1px solid #dce3e6;border-radius:18px;background:#fff;text-align:center;box-shadow:0 12px 36px rgba(25,42,50,.08)}.mark{width:58px;height:58px;margin:0 auto 20px;display:grid;place-items:center;border-radius:50%;background:#eef1f2;color:#66737a;font-size:30px;font-weight:800}h1{margin:0 0 14px;font-size:28px}p{margin:0;color:#68757c;font-size:17px;line-height:1.8}.done{margin-top:20px;color:#33844d;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">×</div>
    <h1>此页面已停止使用</h1>
    <p>原练习页面已经关闭，请不要继续使用或传播此链接。</p>
    <p id="status" class="done">正在清除旧版离线缓存…</p>
  </main>
  <script>
    (async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        localStorage.clear();
        sessionStorage.clear();
        document.getElementById('status').textContent = '旧版离线缓存已清除';
      } catch (error) {
        document.getElementById('status').textContent = '页面已停用';
      }
    })();
  </script>
</body>
</html>
