<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>演習問題トレーニング</title>
    <meta name="theme-color" content="#138a48" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="演習トレーニング" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css?v=faithful52" />
  </head>
  <body>
    <main class="app">
      <section class="panel">
        <header class="topbar">
          <p class="eyebrow">ソフトウェア 演習問題</p>
          <h1>演習問題トレーニング</h1>
        </header>

        <section id="startPanel" class="startPanel">
          <div>
            <p class="eyebrow">新しいラウンド</p>
            <h2>問題数を選択</h2>
            <p>25問・50問は現在の科目からランダムに抽出します。全問も途中で提出できます。答えは提出後にまとめて表示し，間違えた問題は復習リストに残ります。</p>
          </div>
          <div class="subjectChooser" aria-label="科目選択">
            <button class="subject" type="button" data-subject="software">ソフトウェア</button>
            <button class="subject" type="button" data-subject="hardware">ハードウェア</button>
            <button class="subject" type="button" data-subject="security">セキュリティ</button>
          </div>
          <div class="startActions">
            <button id="start25Btn" type="button">25問</button>
            <button id="start50Btn" type="button">50問</button>
            <button id="start52Btn" type="button">全問</button>
            <button id="startWrongBtn" type="button">復習 <span id="wrongBankCount">0</span>問</button>
          </div>
        </section>

        <div class="stats quizOnly">
          <div>
            <span id="doneCount">0</span>
            <small>回答済み</small>
          </div>
          <div>
            <span id="accuracy">0%</span>
            <small>正答率</small>
          </div>
          <div>
            <span id="wrongCount">0</span>
            <small>誤答</small>
          </div>
        </div>

        <div class="modeRow quizOnly utilityHidden">
          <button class="mode active" type="button" data-mode="all">全問</button>
          <button class="mode" type="button" data-mode="wrong">復習</button>
          <button class="mode" type="button" data-mode="unanswered">未回答</button>
        </div>

        <section class="questionBox quizOnly">
          <div class="questionHeader">
            <span id="answerMark" class="answerMark"></span>
            <strong id="questionNo"></strong>
          </div>
          <p id="paperName"></p>
          <h2 id="questionText"></h2>
          <p id="questionHint"></p>
          <div id="questionFigure" class="questionFigure"></div>
          <div id="options" class="options"></div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
        </section>

        <div class="nav quizOnly">
          <button id="prevBtn" type="button">前の問題</button>
          <button id="nextBtn" type="button">次の問題</button>
        </div>

        <section class="quizOnly">
          <div class="sectionTitle">
            <h2>問題一覧</h2>
            <button id="resetBtn" type="button">回答を提出</button>
          </div>
          <div id="questionList" class="questionList"></div>
        </section>
      </section>
    </main>

    <dialog id="resultDialog" class="resultDialog">
      <div class="resultCard">
        <p class="eyebrow">ラウンド完了</p>
        <h2>結果</h2>
        <div class="resultStats">
          <div>
            <span id="resultTime">0分0秒</span>
            <small>所要時間</small>
          </div>
          <div>
            <span id="resultAccuracy">0%</span>
            <small>正答率</small>
          </div>
        </div>
        <p id="resultDetail" class="resultDetail"></p>
        <div class="resultActions">
          <button id="closeResultBtn" type="button">問題を確認</button>
          <button id="newRoundBtn" type="button">新しいラウンド</button>
        </div>
      </div>
    </dialog>

    <script src="./data.js?v=faithful52"></script>
    <script src="./hardware-data.js?v=faithful52"></script>
    <script src="./security-data.js?v=faithful52"></script>
    <script src="./moodle-security-data.js?v=faithful52"></script>
    <script src="./app.js?v=faithful52"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js?v=faithful52").then((registration) => {
          registration.update();
        }).catch(() => {});
      }
    </script>
  </body>
</html>
